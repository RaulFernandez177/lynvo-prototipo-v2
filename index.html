<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Zorlingo - Traductor en Tiempo Real</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        max-width: 1000px;
        margin: 20px auto;
        padding: 20px;
        background-color: #f5f5f5;
      }
      
      h1 {
        color: #333;
        text-align: center;
      }
      
      .controls {
        background: white;
        padding: 20px;
        border-radius: 10px;
        margin-bottom: 20px;
        box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      }
      
      .control-group {
        margin-bottom: 15px;
      }
      
      label {
        display: block;
        margin-bottom: 5px;
        font-weight: bold;
        color: #555;
      }
      
      select, button {
        width: 100%;
        padding: 10px;
        font-size: 16px;
        border: 1px solid #ddd;
        border-radius: 5px;
      }
      
      button {
        background-color: #4CAF50;
        color: white;
        border: none;
        cursor: pointer;
        font-weight: bold;
        margin-top: 10px;
      }
      
      button:hover {
        background-color: #45a049;
      }
      
      button:active {
        background-color: #3d8b40;
      }
      
      #micButton.recording {
        background-color: #f44336;
      }
      
      #autoButton.active {
        background-color: #f44336;
      }
      
      .channel {
        background: white;
        padding: 15px;
        border-radius: 10px;
        margin-bottom: 20px;
        box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      }
      
      .channel h3 {
        margin-top: 0;
        color: #555;
      }
      
      /* === NUEVO: CHAT HEADER === */
      .chat-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 10px;
        flex-wrap: wrap;
        gap: 10px;
      }
      
      .chat-controls {
        display: flex;
        gap: 10px;
        align-items: center;
      }
      
      .toggle-container {
        display: flex;
        align-items: center;
        gap: 5px;
        font-size: 14px;
      }
      
      .toggle-container input[type="checkbox"] {
        width: auto;
        cursor: pointer;
      }
      
      .toggle-container label {
        margin: 0;
        font-weight: normal;
        cursor: pointer;
      }
      
      #exportBtn {
        background-color: #2196F3;
        width: auto;
        padding: 8px 20px;
        font-size: 14px;
        margin: 0;
      }
      
      #exportBtn:hover {
        background-color: #1976D2;
      }
      
      /* === ÁREA DE CONVERSACIÓN === */
      #subtitles {
        max-height: 400px;
        overflow-y: auto;
        border: 1px solid #ccc;
        padding: 10px;
        background-color: #fafafa;
        border-radius: 5px;
      }
      
      /* === NUEVO: MENSAJES TIPO CHAT === */
      .message-sent {
        margin-bottom: 15px;
        text-align: right;
        clear: both;
      }
      
      .message-received {
        margin-bottom: 15px;
        text-align: left;
        clear: both;
      }
      
      .bubble {
        display: inline-block;
        max-width: 70%;
        padding: 10px 15px;
        border-radius: 18px;
        word-wrap: break-word;
        text-align: left;
      }
      
      .message-sent .bubble {
        background-color: #DCF8C6;
      }
      
      .message-received .bubble {
        background-color: #FFFFFF;
        border: 1px solid #e0e0e0;
      }
      
      .timestamp {
        display: block;
        font-size: 11px;
        color: #999;
        margin-top: 5px;
      }
      
      .message-sent .timestamp {
        text-align: right;
      }
      
      .message-received .timestamp {
        text-align: left;
      }
      
      .original-text {
        display: block;
        font-size: 12px;
        color: #666;
        font-style: italic;
        margin-bottom: 5px;
        padding-bottom: 5px;
        border-bottom: 1px solid rgba(0,0,0,0.1);
      }
      
      .translation-text {
        display: block;
        font-size: 15px;
        color: #000;
      }
      
      .status {
        padding: 8px;
        background-color: #e3f2fd;
        border-radius: 5px;
        margin-top: 10px;
        font-size: 14px;
        color: #1976d2;
      }
      /* === BARRAS DE AUDIO === */
.audio-meter-container {
  margin: 10px 0;
}

.audio-meter-container label {
  display: block;
  font-size: 12px;
  color: #666;
  margin-bottom: 5px;
  font-weight: normal;
}

.audio-meter-bg {
  width: 100%;
  height: 20px;
  background-color: #e0e0e0;
  border-radius: 10px;
  overflow: hidden;
  position: relative;
}

.audio-meter-bar {
  height: 100%;
  background: linear-gradient(90deg, #4CAF50 0%, #8BC34A 50%, #FFC107 75%, #FF5722 100%);
  width: 0%;
  transition: width 0.05s ease-out;
  border-radius: 10px;
}
.audio-vumeter {
  display: flex;
  gap: 4px;
  height: 25px;
  align-items: flex-end;
  margin-top: 5px;
}

.audio-vumeter .bar {
  width: 6px;
  background: linear-gradient(to top, #ff5722, #ffc107, #8bc34a);
  height: 5%; /* se actualiza desde JS */
  border-radius: 3px;
  transition: height 0.08s ease-out;
}

    </style>
  </head>
  <body>
    <h1>🌍 Zorlingo - Traductor en Tiempo Real</h1>

    <!-- Panel de Control -->
    <div class="controls">
      <h3>⚙️ Configuración</h3>
      
      <div class="control-group">
        <label for="micSelect">Micrófono para tu voz:</label>
        <select id="micSelect"></select>
      </div>
      
      <div class="control-group">
        <label for="systemSelect">Micrófono para audio entrante (Zoom/YouTube):</label>
        <select id="systemSelect"></select>
      </div>
    </div>

    <!-- Canal Manual (Tu voz) -->
<div class="channel">
  <h3>🎤 Canal Manual (Tú hablas)</h3>
  <button id="micButton">🎤 Hablar</button>
  
  <!-- Barra de audio manual -->
  <div class="audio-vumeter" id="manualMeter">
  <!-- 8 barras -->
  <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
  <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
</div>
  
  
  <div class="status" id="manualStatus">Esperando...</div>
</div>

    <!-- Canal Automático (Tu amigo) -->
<div class="channel">
  <h3>🔊 Canal Automático (Escuchando audio entrante)</h3>
  <button id="autoButton">▶️ Iniciar Escucha Automática</button>
  
  <!-- Barra de audio automático -->
  <div class="audio-vumeter" id="autoMeter">
  <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
  <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
</div>
  
  
  <div class="status" id="autoStatus">Detenido</div>
</div>

    <!-- Conversación -->
    <div class="channel">
      <div class="chat-header">
        <h3>💬 Conversación</h3>
        <div class="chat-controls">
          <div class="toggle-container">
            <input type="checkbox" id="showOriginals">
            <label for="showOriginals">Mostrar originales</label>
          </div>
          <button id="exportBtn">📥 Exportar</button>
        </div>
      </div>
      
      <div id="subtitles">
        <div style="text-align: center; color: #999; padding: 20px;">
          Esperando audio...
        </div>
      </div>
    </div>

    <script src="renderer.js"></script>
  </body>
</html>
